[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-database-analysis"
version = "0.1.0"
description = "Database analysis and visualisation of NBA history"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "click",
    "duckdb",
    "kaggle",
    "pandas",
    "polars",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nba*"]
